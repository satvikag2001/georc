[project]
name = "georc"
version = "0.1.0"
description = "Resolution and prompting fixes for open VLMs on the GeoRC geolocation-reasoning benchmark."
requires-python = ">=3.12"
dependencies = ["huggingface_hub>=0.25"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/georc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
